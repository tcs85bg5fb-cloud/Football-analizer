<main>

<script>

let DATA = [];
let TEAMS = [];
let REFEREES = [];
let SOURCE_COLUMNS = [];


/* ==================================================
   DANE Z D1
   ================================================== */

async function loadLiveData(){

  const res = await fetch(
    '/api/matches?limit=1000',
    {
      cache:'no-store'
    }
  );

  if(!res.ok){

    throw new Error(
      'Nie udało się pobrać danych z bazy D1.'
    );

  }

  const payload = await res.json();

  if(!payload.ok){

    throw new Error(
      payload.error ||
      'API D1 zwróciło błąd.'
    );

  }


  const rows = [];
  const cols = new Set();


  /*
    API zwraca dane z D1.
    raw_data zawiera oryginalne kolumny
    Football-Data.
  */

  (payload.matches || []).forEach(match => {

    const raw =
      match.raw_data &&
      typeof match.raw_data === 'object'
        ? match.raw_data
        : {};


    /*
      Zachowujemy wszystkie oryginalne
      kolumny Football-Data.
    */

    const m = {
      ...raw,

      Season: match.season,

      Date:
        raw.Date ||
        formatISODate(match.match_date),

      HomeTeam:
        match.home_team,

      AwayTeam:
        match.away_team,

      Referee:
        match.referee,

      FTHG:
        match.home_goals,

      FTAG:
        match.away_goals,

      FTR:
        match.result,

      HTHG:
        match.home_ht_goals,

      HTAG:
        match.away_ht_goals,

      HTR:
        match.ht_result,

      HS:
        match.home_shots,

      AS:
        match.away_shots,

      HST:
        match.home_shots_on_target,

      AST:
        match.away_shots_on_target,

      HxG:
        match.home_xg,

      AxG:
        match.away_xg,

      HC:
        match.home_corners,

      AC:
        match.away_corners,

      HF:
        match.home_fouls,

      AF:
        match.away_fouls,

      HY:
        match.home_yellow_cards,

      AY:
        match.away_yellow_cards,

      HR:
        match.home_red_cards,

      AR:
        match.away_red_cards

    };


    rows.push(m);


    Object.keys(raw).forEach(k => {
      cols.add(k);
    });

  });


  DATA = rows;

  SOURCE_COLUMNS = [...cols];


  TEAMS = [
    ...new Set(
      DATA.flatMap(m => [
        m.HomeTeam,
        m.AwayTeam
      ])
      .filter(Boolean)
    )
  ].sort(
    (a,b) =>
      a.localeCompare(
        b,
        'pl'
      )
  );


  REFEREES = [
    ...new Set(
      DATA
        .map(m => m.Referee)
        .filter(Boolean)
    )
  ].sort(
    (a,b) =>
      a.localeCompare(
        b,
        'pl'
      )
  );


  return payload;

}


/* ==================================================
   POMOCNICZE
   ================================================== */

function formatISODate(value){

  if(!value){
    return '';
  }

  const m =
    String(value)
      .match(
        /^(\d{4})-(\d{2})-(\d{2})/
      );

  if(!m){
    return String(value);
  }

  return `${m[3]}/${m[2]}/${m[1]}`;

}


function parseCSV(text){

  text = String(text || '')
    .replace(/^\uFEFF/, '');

  const rows = [];

  let row = [];
  let cell = '';
  let quoted = false;


  for(
    let i=0;
    i<text.length;
    i++
  ){

    const c = text[i];


    if(quoted){

      if(c === '"'){

        if(text[i+1] === '"'){

          cell += '"';
          i++;

        }else{

          quoted = false;

        }

      }else{

        cell += c;

      }

    }else{

      if(c === '"'){

        quoted = true;

      }else if(c === ','){

        row.push(cell);
        cell = '';

      }else if(c === '\n'){

        row.push(cell);

        rows.push(row);

        row = [];
        cell = '';

      }else if(c !== '\r'){

        cell += c;

      }

    }

  }


  if(
    cell !== '' ||
    row.length
  ){

    row.push(cell);
    rows.push(row);

  }


  const headers =
    (rows.shift() || [])
      .map(
        h => h.trim()
      );


  return rows
    .filter(
      r =>
        r.some(
          v =>
            String(v).trim() !== ''
        )
    )
    .map(r => {

      const o = {};

      headers.forEach(
        (h,i) => {

          let v =
            (r[i] ?? '')
              .trim();


          if(v === ''){

            o[h] = null;

          }else if(
            /^[-+]?\d+(\.\d+)?$/.test(v)
          ){

            o[h] = Number(v);

          }else{

            o[h] = v;

          }

        }
      );

      return o;

    });

}


function dateVal(s){

  if(!s){
    return 0;
  }


  const value =
    String(s);


  /*
    dd/mm/yyyy
  */

  const p =
    value.split('/');


  if(p.length === 3){

    return new Date(
      Number(p[2]),
      Number(p[1]) - 1,
      Number(p[0])
    ).getTime();

  }


  /*
    yyyy-mm-dd
  */

  const iso =
    value.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );


  if(iso){

    return new Date(
      Number(iso[1]),
      Number(iso[2]) - 1,
      Number(iso[3])
    ).getTime();

  }


  return 0;

}


const num = v => {

  const x =
    Number(v);

  return Number.isFinite(x)
    ? x
    : null;

};


const avg = a => {

  a =
    a.filter(
      x => x != null
    );

  return a.length
    ? a.reduce(
        (x,y) => x+y,
        0
      ) / a.length
    : null;

};


const f = x =>
  x == null
    ? '—'
    : x.toFixed(1);


const esc = s =>
  String(s ?? '')
    .replace(
      /[&<>"]/g,
      m =>
        ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;'
        }[m])
    );


function fillSelect(
  sel,
  items
){

  items.forEach(
    t => {

      const o =
        document.createElement(
          'option'
        );

      o.value = t;
      o.textContent = t;

      sel.appendChild(o);

    }
  );

}


/* ==================================================
   STATYSTYKI
   ================================================== */

const statDefs = [

  ['Gole','FTHG','FTAG'],

  ['Strzały','HS','AS'],

  ['Strzały celne','HST','AST'],

  ['xG','HxG','AxG'],

  ['Faule','HF','AF'],

  ['Rożne','HC','AC'],

  ['Żółte kartki','HY','AY'],

  ['Czerwone kartki','HR','AR']

];


function teamMatches(
  team,
  venue
){

  return DATA

    .filter(
      m =>
        venue === 'home'
          ? m.HomeTeam === team
          : m.AwayTeam === team
    )

    .sort(
      (a,b) =>
        dateVal(b.Date) -
        dateVal(a.Date)
    );

}


function sideVal(
  m,
  venue,
  pair
){

  return num(
    m[
      venue === 'home'
        ? pair[0]
        : pair[1]
    ]
  );

}


function stats(
  team,
  venue
){

  const r =
    teamMatches(
      team,
      venue
    );


  const out = {
    n:r.length
  };


  statDefs.forEach(
    ([name,h,a]) => {

      const vals =
        r.map(
          m =>
            sideVal(
              m,
              venue,
              [h,a]
            )
        );


      const opp =
        r.map(
          m =>
            sideVal(
              m,
              venue,
              [a,h]
            )
        );


      out[name] = {
        for:avg(vals),
        against:avg(opp)
      };

    }
  );


  return out;

}


function outcomeFor(
  m,
  team
){

  const homeTeam =
    m.HomeTeam === team;


  if(
    m.FTHG == null ||
    m.FTAG == null
  ){

    return '—';

  }


  const diff =
    Number(m.FTHG) -
    Number(m.FTAG);


  return (
    homeTeam
      ? diff
      : -diff
  ) > 0

    ? 'W'

    : (
        homeTeam
          ? diff
          : -diff
      ) < 0

      ? 'L'

      : 'D';

}


function resultClass(x){

  return x === 'W'
    ? 'W'
    : x === 'L'
      ? 'L'
      : 'D';

}


/* ==================================================
   KARTA STATYSTYK DRUŻYNY
   ================================================== */

function summaryCard(

    'Faule',

      <tr>
        <th>Statystyka</th>

      </tr>


      ${

          k => `

            <td>

            </td>

            <td>
              ${f(s[k].against)}
            </td>

      }

</section>

`;

}

/* ==================================================
   PROFIL SĘDZIEGO

    DATA.filter(

/* ==================================================
   H2H
   ================================================== */

function h2h(
  h,
  a
){

  return DATA

    .filter(
      m =>
        (
          m.HomeTeam === h &&
          m.AwayTeam === a
        ) ||
        (
          m.HomeTeam === a &&
          m.AwayTeam === h
        )
    )

    .sort(
      (x,y) =>
        dateVal(y.Date) -
        dateVal(x.Date)
    )

    .slice(
      0,
      10
    );

}

    Baza zawiera wszystkie zaimportowane dane
    meczowe z obu sezonów, w tym statystyki,
    sędziego, gole do przerwy oraz kursy bukmacherskie.

  </div>


  <div
    class="small"
    style="margin-top:8px">

    Kolumn źródłowych:
    ${SOURCE_COLUMNS.length}

    • rekordów:
    ${DATA.length}

    • źródło:
    D1

  </div>

</section>

`;

}


/* ==================================================
   ANALIZA
   ================================================== */

function analyze(){

  const h =
    home.value;

  const a =
    away.value;


  if(h === a){

    results.innerHTML = `

      <section class="card">

        Wybierz dwie różne drużyny.

      </section>

    `;

    return;

  }


  const r =
    referee.value;


  results.innerHTML = `

<section class="card">

  <h2>
    ${esc(h)}
    –
    ${esc(a)}
  </h2>


  <span class="badge">
    Premier League • MVP danych
  </span>


  <div
    class="muted"
    style="margin-top:8px">

    2025/26 + 2026/27.

    Gospodarz:
    mecze u siebie;

    gość:
    mecze wyjazdowe.

  </div>

</section>


<div class="grid">

  ${summaryCard(h,'home')}

  ${summaryCard(a,'away')}

</div>


${recent(h,'home')}

${recent(a,'away')}

${h2hCard(h,a)}

${refereeProfile(r)}

${allDataNote()}

`;

}


/* ==================================================
   START
   ================================================== */

async function boot(){

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    'Pobieranie danych z bazy D1…';


  try{

    const payload =
      await loadLiveData();


    fillSelect(
      home,
      TEAMS
    );


    fillSelect(
      away,
      TEAMS
    );


    fillSelect(
      referee,
      REFEREES
    );


    home.value =
      TEAMS.includes('Arsenal')
        ? 'Arsenal'
        : TEAMS[0] || '';


    away.value =
      TEAMS.includes('Liverpool')
        ? 'Liverpool'
        : TEAMS.find(
            t =>
              t !== home.value
          ) ||
          TEAMS[1] ||
          '';


    document
      .getElementById('analyze')
      .onclick = analyze;


    status.textContent =
      `D1: ${DATA.length} meczów, ` +
      `${TEAMS.length} drużyn i ` +
      `${REFEREES.length} sędziów. ` +
      `Baza: football-analyzer-db.`;


    analyze();


  }catch(e){

    console.error(e);


    status.textContent =
      e.message ||
      'Nie udało się pobrać danych z D1.';


    results.innerHTML = `

      <section class="card">

        <h2>
          Nie udało się załadować danych
        </h2>

        <div class="muted">

          Aplikacja nie może obecnie
          pobrać danych z bazy D1.
          Spróbuj odświeżyć stronę.

        </div>

      </section>

    `;

  }

}


boot();

</script>
