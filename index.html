<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Football Stats Analyzer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:900px;margin:auto;padding:10px}
.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 5px #0001}
h1{margin:0 0 4px;font-size:25px} h2{margin:0 0 10px;font-size:19px}
.muted,.small{color:#6e6e73;font-size:13px}.small{font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}
select,input{width:100%;padding:12px;border:1px solid #c7c7cc;border-radius:11px;background:#fff;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#111;color:#fff;font-size:16px;font-weight:700}
button.secondary{background:#eee;color:#111}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:#f2f2f7;border-radius:12px;padding:10px;margin-top:10px}
.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#eee;font-size:12px;font-weight:650;white-space:nowrap}
.searchbox{margin-bottom:6px}
.compare-head,.stat-row{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;gap:8px;align-items:center}
.compare-head{font-size:12px;color:#6e6e73;font-weight:650;margin-bottom:2px}
.stat-row{padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.stat-row:last-child{border-bottom:0}
.stat-name{font-weight:600}.val{text-align:right;font-variant-numeric:tabular-nums}.better{font-weight:800}
.formline{display:flex;gap:5px;align-items:center;margin:7px 0}
.formteam{font-weight:700;min-width:90px}
.formdot{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:#eee;font-size:11px;font-weight:800}
.formdot.w{background:#dff5e3}.formdot.d{background:#fff1c7}.formdot.l{background:#ffdede}
.match-card{padding:10px 0;border-bottom:1px solid #eee}.match-card:last-child{border-bottom:0}
.match-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#6e6e73}
.match-main{font-weight:650;margin:3px 0}.match-stats{font-size:12px;color:#6e6e73}
details summary{cursor:pointer;font-weight:750;list-style:none}.summary-arrow{float:right;color:#6e6e73}
.tablelike{width:100%;font-size:14px}.table-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.table-row:last-child{border-bottom:0}
.empty{padding:12px 0;color:#6e6e73}
@media(max-width:600px){.grid,.controls{grid-template-columns:1fr}.compare-head,.stat-row{grid-template-columns:minmax(0,1fr) 62px 62px}.card{padding:14px}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>⚽ Football Stats Analyzer</h1>
<div class="muted">Premier League • 2025/26 + 2026/27</div>
<div class="note small">Analiza jest projektowana mobile-first. Domyślnie porównujemy HOME gospodarza z AWAY gościa; można przełączyć na wszystkie mecze.</div>
</section>

<section class="card">
<div class="grid">
<div>
<label for="homeSearch">Gospodarz</label>
<input id="homeSearch" class="searchbox" placeholder="🔍 Wyszukaj drużynę…">
<select id="home"></select>
</div>
<div>
<label for="awaySearch">Gość</label>
<input id="awaySearch" class="searchbox" placeholder="🔍 Wyszukaj drużynę…">
<select id="away"></select>
</div>
</div>

<div style="margin-top:12px">
<label for="refSearch">Sędzia (opcjonalnie)</label>
<input id="refSearch" class="searchbox" placeholder="🔍 Wyszukaj sędziego…">
<select id="referee"><option value="">Dowolny / nie wybieraj</option></select>
</div>

<div class="controls" style="margin-top:12px">
<div>
<label for="sample">Mecze do analizy</label>
<select id="sample">
<option value="5">5</option><option value="10" selected>10</option><option value="15">15</option>
<option value="20">20</option><option value="30">30</option><option value="50">50</option>
<option value="all">Wszystkie</option>
</select>
</div>
<div>
<label for="venueMode">Sposób analizy</label>
<select id="venueMode">
<option value="split" selected>Home / Away</option>
<option value="all">Wszystkie mecze</option>
</select>
</div>
</div>

<button id="analyze" style="margin-top:12px">Analizuj mecz</button>
<div id="status" class="muted" style="margin-top:10px"></div>
</section>

<div id="results"></div>
</main>

<script>
let DATA=[],TEAMS=[],REFEREES=[],SOURCE_COLUMNS=[];

async function loadLiveData(){
 const res=await fetch('/api/matches?limit=1000',{cache:'no-store'});
 if(!res.ok) throw new Error('Nie udało się pobrać danych z bazy D1.');
 const payload=await res.json();
 if(!payload.ok) throw new Error(payload.error||'API D1 zwróciło błąd.');
 const rows=[],cols=new Set();
 (payload.matches||[]).forEach(match=>{
  const raw=match.raw_data&&typeof match.raw_data==='object'?match.raw_data:{};
  const m={...raw,Season:match.season,Date:raw.Date||formatISODate(match.match_date),
   HomeTeam:match.home_team,AwayTeam:match.away_team,Referee:match.referee,
   FTHG:match.home_goals,FTAG:match.away_goals,FTR:match.result,
   HTHG:match.home_ht_goals,HTAG:match.away_ht_goals,HTR:match.ht_result,
   HS:match.home_shots,AS:match.away_shots,HST:match.home_shots_on_target,AST:match.away_shots_on_target,
   HxG:match.home_xg,AxG:match.away_xg,HC:match.home_corners,AC:match.away_corners,
   HF:match.home_fouls,AF:match.away_fouls,HY:match.home_yellow_cards,AY:match.away_yellow_cards,
   HR:match.home_red_cards,AR:match.away_red_cards};
  rows.push(m); Object.keys(raw).forEach(k=>cols.add(k));
 });
 DATA=rows; SOURCE_COLUMNS=[...cols];
 TEAMS=[...new Set(DATA.flatMap(m=>[m.HomeTeam,m.AwayTeam]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
 REFEREES=[...new Set(DATA.map(m=>m.Referee).filter(Boolean))].sort(sortBySurname);
 return payload;
}
function formatISODate(v){if(!v)return '';const m=String(v).match(/^(\\d{4})-(\\d{2})-(\\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(v)}
function dateVal(s){
 if(!s)return 0; const v=String(s),p=v.split('/');
 if(p.length===3)return new Date(+p[2],+p[1]-1,+p[0]).getTime();
 const m=v.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);
 return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():0;
}
const num=v=>{const x=Number(v);return Number.isFinite(x)?x:null};
const avg=a=>{const x=a.filter(v=>v!=null);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null};
const f=x=>x==null?'—':x.toFixed(1);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function sortBySurname(a,b){const sa=String(a).trim().split(/\\s+/).pop(),sb=String(b).trim().split(/\\s+/).pop();return sa.localeCompare(sb,'pl')||String(a).localeCompare(String(b),'pl')}
function fillSelect(sel,items){sel.innerHTML='';items.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o)})}
function filterSelect(searchId,selectId,items){
 const q=document.getElementById(searchId).value.trim().toLocaleLowerCase('pl');
 const filtered=q?items.filter(x=>x.toLocaleLowerCase('pl').includes(q)):items;
 const current=document.getElementById(selectId).value;
 fillSelect(document.getElementById(selectId),filtered);
 if(filtered.includes(current)) document.getElementById(selectId).value=current;
}
function teamMatches(team,venue){
 return DATA.filter(m=>venue==='home'?m.HomeTeam===team:venue==='away'?m.AwayTeam===team:(m.HomeTeam===team||m.AwayTeam===team))
 .sort((a,b)=>dateVal(b.Date)-dateVal(a.Date));
}
const statDefs=[
 ['Gole','FTHG','FTAG','higher'],['Strzały','HS','AS','higher'],['Strzały celne','HST','AST','higher'],
 ['xG','HxG','AxG','higher'],['Faule','HF','AF','lower'],['Rożne','HC','AC','higher'],
 ['Żółte kartki','HY','AY','lower'],['Czerwone kartki','HR','AR','lower']
];
function sideVal(m,venue,pair){return num(m[venue==='home'?pair[0]:pair[1]])}
function stats(team,venue,limit){
 let r=teamMatches(team,venue); if(limit!=='all')r=r.slice(0,+limit);
 const out={n:r.length};
 statDefs.forEach(([name,h,a])=>{
  const vals=r.map(m=>sideVal(m,venue,[h,a])),opp=r.map(m=>sideVal(m,venue,[a,h]));
  out[name]={for:avg(vals),against:avg(opp),rule:statDefs.find(x=>x[0]===name)[3]};
 });
 return out;
}
function betterClass(a,b,rule){if(a==null||b==null||a===b)return '';return (rule==='higher'?a>b:a<b)?'better':''}
function outcomeFor(m,team){
 if(m.FTHG==null||m.FTAG==null)return '—'; const d=+m.FTHG-+m.FTAG;
 const teamHome=m.HomeTeam===team, v=teamHome?d:-d; return v>0?'W':v<0?'L':'D';
}
function summaryCompare(h,a,mode,limit){
 const hv=mode==='split'?'home':'all',av=mode==='split'?'away':'all';
 const hs=stats(h,hv,limit),as=stats(a,av,limit);
 const labels=statDefs.map(x=>x[0]);
 return `<section class="card">
 <div class="section-title"><h2>📊 Porównanie</h2><span class="badge">${limit==='all'?'Wszystkie':limit} meczów</span></div>
 <div class="compare-head"><div></div><div style="text-align:right">${esc(h)}</div><div style="text-align:right">${esc(a)}</div></div>
 ${labels.map(k=>`<div class="stat-row"><div class="stat-name">${k}</div><div class="val ${betterClass(hs[k].for,as[k].for,hs[k].rule)}">${f(hs[k].for)}</div><div class="val ${betterClass(as[k].for,hs[k].for,hs[k].rule)}">${f(as[k].for)}</div></div>`).join('')}
 <div class="small" style="margin-top:8px">Pogrubienie oznacza przewagę w danej metryce. Dla fauli i kartek niższa średnia jest traktowana jako lepsza.</div>
 </section>`;
}
function formCard(h,a,mode,limit){
 const hv=mode==='split'?'home':'all',av=mode==='split'?'away':'all';
 const n=limit==='all'?5:Math.min(5,+limit);
 const hm=teamMatches(h,hv).slice(0,n),am=teamMatches(a,av).slice(0,n);
 const line=(team,arr)=>`<div class="formline"><div class="formteam">${esc(team)}</div>${arr.map(m=>{const x=outcomeFor(m,team);return `<span class="formdot ${x.toLowerCase()}">${x}</span>`}).join('')}</div>`;
 return `<section class="card"><h2>📈 Forma</h2>${line(h,hm)}${line(a,am)}<div class="small">Ostatnie ${n} spotkań w wybranym trybie.</div></section>`;
}
function recentCard(team,venue,limit){
 const r=teamMatches(team,venue).slice(0,limit==='all'?10:+limit);
 const label=venue==='home'?'HOME':venue==='away'?'AWAY':'HOME + AWAY';
 return `<section class="card"><div class="section-title"><h2>📋 Ostatnie mecze — ${esc(team)}</h2><span class="badge">${label}</span></div>
 ${r.length?r.map(m=>`<div class="match-card"><div class="match-top"><span>${esc(m.Date)}</span><span>${outcomeFor(m,team)}</span></div>
 <div class="match-main">${esc(m.HomeTeam)} ${m.FTHG??'—'}:${m.FTAG??'—'} ${esc(m.AwayTeam)}</div>
 <div class="match-stats">Strzały ${m.HS??'—'}:${m.AS??'—'} · Celne ${m.HST??'—'}:${m.AST??'—'} · Rożne ${m.HC??'—'}:${m.AC??'—'} · Faule ${m.HF??'—'}:${m.AF??'—'} · ŻK ${m.HY??'—'}:${m.AY??'—'}</div>
 </div>`).join(''):'<div class="empty">Brak danych.</div>'}</section>`;
}
function h2hCard(h,a){
 const r=DATA.filter(m=>(m.HomeTeam===h&&m.AwayTeam===a)||(m.HomeTeam===a&&m.AwayTeam===h)).sort((x,y)=>dateVal(y.Date)-dateVal(x.Date)).slice(0,10);
 return `<section class="card"><div class="section-title"><h2>🤝 H2H</h2><span class="badge">${r.length} / max 10</span></div>
 ${r.length?r.map(m=>`<div class="match-card"><div class="match-top"><span>${esc(m.Date)}</span><span>${esc(m.Referee||'')}</span></div><div class="match-main">${esc(m.HomeTeam)} ${m.FTHG??'—'}:${m.FTAG??'—'} ${esc(m.AwayTeam)}</div><div class="match-stats">Strzały ${m.HS??'—'}:${m.AS??'—'} · Celne ${m.HST??'—'}:${m.AST??'—'} · Rożne ${m.HC??'—'}:${m.AC??'—'}</div></div>`).join(''):'<div class="empty">Brak H2H w danych.</div>'}</section>`;
}
function refereeProfile(name){
 if(!name)return '';
 const r=DATA.filter(m=>m.Referee===name);
 const av=k=>avg(r.map(m=>num(m[k])));
 const total=k1=>avg(r.map(m=>{const a=num(m[k1[0]]),b=num(m[k1[1]]);return a!=null&&b!=null?a+b:null}));
 return `<section class="card"><div class="section-title"><h2>👨‍⚖️ ${esc(name)}</h2><span class="badge">${r.length} meczów</span></div>
 <div class="tablelike">
 <div class="table-row"><div>Faule gospodarzy</div><div style="text-align:right">${f(av('HF'))}</div></div>
 <div class="table-row"><div>Faule gości</div><div style="text-align:right">${f(av('AF'))}</div></div>
 <div class="table-row"><div>Faule łącznie</div><div style="text-align:right">${f(total(['HF','AF']))}</div></div>
 <div class="table-row"><div>Żółte gospodarzy</div><div style="text-align:right">${f(av('HY'))}</div></div>
 <div class="table-row"><div>Żółte gości</div><div style="text-align:right">${f(av('AY'))}</div></div>
 <div class="table-row"><div>Żółte łącznie</div><div style="text-align:right">${f(total(['HY','AY']))}</div></div>
 <div class="table-row"><div>Czerwone łącznie</div><div style="text-align:right">${f(total(['HR','AR']))}</div></div>
 </div></section>`;
}
function detailsCard(h,a,mode,limit){
 const hv=mode==='split'?'home':'all',av=mode==='split'?'away':'all';
 const hs=stats(h,hv,limit),as=stats(a,av,limit);
 return `<section class="card"><details><summary>📊 Szczegółowe statystyki <span class="summary-arrow">＋</span></summary><div style="margin-top:10px">
 <div class="compare-head"><div></div><div style="text-align:right">${esc(h)}</div><div style="text-align:right">${esc(a)}</div></div>
 ${statDefs.map(([k,, ,rule])=>`<div class="stat-row"><div>${k} — przeciwko</div><div class="val ${betterClass(hs[k].against,as[k].against,rule)}">${f(hs[k].against)}</div><div class="val ${betterClass(as[k].against,hs[k].against,rule)}">${f(as[k].against)}</div></div>`).join('')}
 </div></details></section>`;
}
function allDataNote(){return `<section class="card"><h2>📦 Dane</h2><div class="muted">Dane są pobierane bezpośrednio z D1. ${DATA.length} meczów, ${TEAMS.length} drużyn, ${REFEREES.length} sędziów.</div></section>`}
function analyze(){
 const h=document.getElementById('home').value,a=document.getElementById('away').value;
 if(!h||!a||h===a){document.getElementById('results').innerHTML='<section class="card">Wybierz dwie różne drużyny.</section>';return}
 const r=document.getElementById('referee').value,limit=document.getElementById('sample').value,mode=document.getElementById('venueMode').value;
 const hv=mode==='split'?'home':'all',av=mode==='split'?'away':'all';
 document.getElementById('results').innerHTML=`
 <section class="card"><h2>${esc(h)} — ${esc(a)}</h2><span class="badge">Premier League • analiza danych</span>
 <div class="muted" style="margin-top:8px">Zakres: ${limit==='all'?'wszystkie mecze':limit+' meczów'} · Tryb: ${mode==='split'?'Home / Away':'Wszystkie mecze'}</div></section>
 ${summaryCompare(h,a,mode,limit)}
 ${formCard(h,a,mode,limit)}
 ${detailsCard(h,a,mode,limit)}
 ${recentCard(h,hv,limit)}
 ${recentCard(a,av,limit)}
 ${h2hCard(h,a)}
 ${refereeProfile(r)}
 ${allDataNote()}`;
}
async function boot(){
 const status=document.getElementById('status');status.textContent='Pobieranie danych z bazy D1…';
 try{
  await loadLiveData();
  fillSelect(document.getElementById('home'),TEAMS);fillSelect(document.getElementById('away'),TEAMS);fillSelect(document.getElementById('referee'),['',...REFEREES]);
  document.getElementById('home').value=TEAMS.includes('Arsenal')?'Arsenal':TEAMS[0]||'';
  document.getElementById('away').value=TEAMS.includes('Liverpool')?'Liverpool':TEAMS.find(t=>t!==document.getElementById('home').value)||TEAMS[1]||'';
  document.getElementById('analyze').onclick=analyze;
  document.getElementById('sample').onchange=analyze;document.getElementById('venueMode').onchange=analyze;document.getElementById('referee').onchange=analyze;
  document.getElementById('homeSearch').oninput=()=>filterSelect('homeSearch','home',TEAMS);
  document.getElementById('awaySearch').oninput=()=>filterSelect('awaySearch','away',TEAMS);
  document.getElementById('refSearch').oninput=()=>{
   const q=document.getElementById('refSearch').value.trim().toLocaleLowerCase('pl');
   const items=q?REFEREES.filter(x=>x.toLocaleLowerCase('pl').includes(q)):REFEREES;
   const current=document.getElementById('referee').value;fillSelect(document.getElementById('referee'),['',...items]);
   if(items.includes(current))document.getElementById('referee').value=current;
  };
  status.textContent=`D1: ${DATA.length} meczów, ${TEAMS.length} drużyn i ${REFEREES.length} sędziów. Baza: football-analyzer-db.`;
  analyze();
 }catch(e){console.error(e);status.textContent=e.message||'Nie udało się pobrać danych z D1.';document.getElementById('results').innerHTML='<section class="card"><h2>Nie udało się załadować danych</h2><div class="muted">Spróbuj odświeżyć stronę.</div></section>'}
}
boot();
</script>
</body>
</html>
