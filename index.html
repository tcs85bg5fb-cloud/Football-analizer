<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Football Stats Analyzer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:10px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 5px #0001}h1{margin:0 0 5px;font-size:26px}h2{margin:0;font-size:20px}.muted{color:#6e6e73;font-size:13px}.small{color:#6e6e73;font-size:12px}.note{background:#f2f2f7;border-radius:12px;padding:10px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field{position:relative}input,select{width:100%;height:46px;padding:0 12px;border:1px solid #c7c7cc;border-radius:11px;background:#fff;color:#171717;font-size:16px}.searchbox{margin-bottom:0}button{width:100%;height:48px;margin-top:12px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px;font-weight:750}.autocomplete{position:absolute;z-index:100;left:0;right:0;top:52px;background:#fff;border:1px solid #d1d1d6;border-radius:12px;box-shadow:0 7px 22px #0002;max-height:260px;overflow:auto}.autocomplete-item{padding:11px 12px;border-bottom:1px solid #eee;cursor:pointer}.autocomplete-item:last-child{border-bottom:0}.autocomplete-item strong{display:block}.autocomplete-item span{display:block;color:#6e6e73;font-size:12px;margin-top:2px}.autocomplete-empty{padding:12px;color:#6e6e73;font-size:13px}.selection{margin-top:7px;min-height:16px;color:#6e6e73;font-size:12px}
.selection:not(:empty){min-height:40px;padding:9px 11px;background:#f2f2f7;border:1px solid #d1d1d6;border-radius:11px;color:#171717;font-size:14px;font-weight:750;display:flex;align-items:center}
.selection:not(:empty)::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:7px;border-radius:50%;background:#171717;color:#fff;font-size:12px;font-weight:850}
.badge{display:inline-block;padding:6px 9px;border-radius:9px;background:#eee;font-size:12px;font-weight:700;white-space:nowrap}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.compare{margin-top:10px}.cr{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}.cr:last-child{border-bottom:0}.cr.head{font-size:12px;color:#6e6e73;font-weight:700;padding-top:0}.num{text-align:right;font-variant-numeric:tabular-nums}.better{font-weight:850}.sub{color:#777;font-size:12px}.formline{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px}.formteam{width:100%;font-weight:750}.dot{display:inline-flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:850}.dot.w{background:#e5f7eb;color:#15803d}.dot.d{background:#fff2c7;color:#946200}.dot.l{background:#ffe5e5;color:#c62828}.team-section{border-top:1px solid #eee;padding-top:14px;margin-top:14px}.team-section:first-child{border-top:0;padding-top:0;margin-top:10px}.match{padding:11px 0;border-bottom:1px solid #eee}.match:last-child{border-bottom:0}.match-head{display:flex;justify-content:space-between;align-items:center;color:#6e6e73;font-size:12px}.match-name{font-weight:750;margin:5px 0}.score{font-weight:850;color:#171717}.result{display:inline-flex;min-width:28px;height:25px;padding:0 7px;border-radius:9px;align-items:center;justify-content:center;font-weight:850}.result.w{background:#e5f7eb;color:#15803d}.result.d{background:#fff2c7;color:#946200}.result.l{background:#ffe5e5;color:#c62828}.match-table{width:100%;border-collapse:collapse;font-size:13px}.match-table td{padding:4px 0;border-bottom:1px solid #f0f0f0}.match-table tr:last-child td{border-bottom:0}.match-table td:first-child{color:#6e6e73;width:55%}.match-table td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.recent-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:9px;border:1px solid #e5e5ea;border-radius:12px}
.recent-table{width:100%;min-width:920px;border-collapse:collapse;font-size:12px}
.recent-table th,.recent-table td{padding:8px 9px;border-bottom:1px solid #eee;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.recent-table th{background:#f7f7f9;color:#6e6e73;font-size:11px;font-weight:750;position:sticky;top:0;z-index:1}
.recent-table th:first-child,.recent-table td:first-child,.recent-table th:nth-child(2),.recent-table td:nth-child(2){text-align:left}
.recent-table tbody tr:last-child td{border-bottom:0}
.recent-table .opponent{font-weight:750}
.table-note{margin-top:6px;color:#6e6e73;font-size:11px}
.ref-row{display:grid;grid-template-columns:1fr 85px;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}.ref-row:last-child{border-bottom:0}.ref-row div:last-child{text-align:right}.empty{padding:12px 0;color:#6e6e73}.error{background:#fff1f1;color:#a51d1d;border:1px solid #efcccc}@media(max-width:650px){main{padding:7px}.card{padding:14px}.grid,.controls{grid-template-columns:1fr}.cr{grid-template-columns:minmax(0,1fr) 66px 66px}}
</style>
</head>
<body><main>
<section class="card"><h1>⚽ Football Stats Analyzer</h1><div class="muted">Porównanie drużyn na podstawie danych z D1.</div><div class="note small">Domyślnie: HOME dla gospodarza i AWAY dla gościa. Możesz przełączyć na wszystkie mecze.</div></section>
<section class="card">
<div class="grid">
<div class="field"><label>Gospodarz</label><input id="homeSearch" class="searchbox" autocomplete="off" placeholder="🔍 Wyszukaj drużynę…"><div id="homeAuto" class="autocomplete" hidden></div><div id="homeSelected" class="selection"></div></div>
<div class="field"><label>Gość</label><input id="awaySearch" class="searchbox" autocomplete="off" placeholder="🔍 Wyszukaj drużynę…"><div id="awayAuto" class="autocomplete" hidden></div><div id="awaySelected" class="selection"></div></div>
</div>
<div class="grid" style="margin-top:12px">
<div class="field"><label>Liga — opcjonalnie</label><input id="leagueSearch" class="searchbox" autocomplete="off" placeholder="🔍 Wyszukaj ligę…"><div id="leagueAuto" class="autocomplete" hidden></div><div id="leagueSelected" class="selection"></div></div>
<div class="field"><label>Sędzia — opcjonalnie</label><input id="refSearch" class="searchbox" autocomplete="off" placeholder="🔍 Wyszukaj sędziego…"><div id="refAuto" class="autocomplete" hidden></div><div id="refSelected" class="selection"></div></div>
</div>
<div class="controls"><div><label>Mecze do analizy</label><select id="sample"><option value="5" selected>5</option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="30">30</option><option value="50">50</option><option value="all">Wszystkie</option></select></div><div><label>Sposób analizy</label><select id="venueMode"><option value="split" selected>Home / Away</option><option value="all">Wszystkie mecze</option></select></div></div>
<button id="analyze">Analizuj mecz</button><div id="status" class="muted" style="margin-top:10px"></div>
</section><div id="results"></div></main>
<script>
let DATA=[],LEAGUES=[],TEAMS=[],REFEREES=[],homeTeam='',awayTeam='',league=null,referee=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pl').trim();
function num(v){if(v===null||v===undefined||v==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function avg(a){const x=a.map(num).filter(v=>v!==null);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null}
function f(v){const n=num(v);return n===null?'—':n.toFixed(1).replace('.',',')}
function dateVal(v){if(!v)return 0;let s=String(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]).getTime();m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]).getTime();return Date.parse(s)||0}
function dateText(v){if(!v)return '—';const s=String(v);return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):s}
function team(m,side){return side==='home'?(m.home_team??m.HomeTeam??''):(m.away_team??m.AwayTeam??'')}
function lcode(m){return m.league_code||m.leagueCode||null}
function lname(code){const l=LEAGUES.find(x=>x.code===code);return l?`${l.country} — ${l.name}`:(code||'')}
function teamRows(t,v){return DATA.filter(m=>{const h=team(m,'home')===t,a=team(m,'away')===t;if(v==='home'&&!h)return false;if(v==='away'&&!a)return false;if(v==='all'&&!h&&!a)return false;if(league&&lcode(m)!==league.code)return false;return true}).sort((a,b)=>dateVal(b.match_date??b.Date)-dateVal(a.match_date??a.Date))}
function own(m,t,h,a){return team(m,'home')===t?num(m[h]):num(m[a])}
function opp(m,t,h,a){return team(m,'home')===t?num(m[a]):num(m[h])}
const ST=[
 {k:'goals',n:'Gole',h:'home_goals',a:'away_goals',o:'higher',d:'lower'},
 {k:'shots',n:'Strzały',h:'home_shots',a:'away_shots',o:'higher',d:'lower'},
 {k:'sot',n:'Strzały celne',h:'home_shots_on_target',a:'away_shots_on_target',o:'higher',d:'lower'},
 {k:'xg',n:'xG',h:'home_xg',a:'away_xg',o:'higher',d:'lower'},
 {k:'corners',n:'Rożne',h:'home_corners',a:'away_corners',o:'higher',d:'lower'},
 {k:'fouls',n:'Faule',h:'home_fouls',a:'away_fouls',o:'lower',d:'higher'},
 {k:'yellow',n:'Żółte kartki',h:'home_yellow_cards',a:'away_yellow_cards',o:'lower',d:'higher'},
 {k:'red',n:'Czerwone kartki',h:'home_red_cards',a:'away_red_cards',o:'lower',d:'higher'},
 {k:'possession',n:'Posiadanie %',h:'home_possession',a:'away_possession',o:'higher',d:'lower'}
];
function stats(t,v,limit){let r=teamRows(t,v);if(limit!=='all')r=r.slice(0,+limit);const o={n:r.length};ST.forEach(s=>o[s.k]={own:avg(r.map(m=>own(m,t,s.h,s.a))),against:avg(r.map(m=>opp(m,t,s.h,s.a)))});return o}
function better(a,b,rule){a=num(a);b=num(b);if(a===null||b===null||a===b)return '';return (rule==='higher'?a>b:a<b)?'better':''}
function comparison(h,a,hv,av,limit){const hs=stats(h,hv,limit),as=stats(a,av,limit);return `<section class="card"><div class="section-title"><h2>📊 Porównanie</h2><span class="badge">${limit==='all'?'Wszystkie':limit} meczów</span></div><div class="compare"><div class="cr head"><div>Statystyka</div><div class="num">${esc(h)}</div><div class="num">${esc(a)}</div></div>${ST.map(s=>`<div class="cr"><div>${esc(s.n)}</div><div class="num ${better(hs[s.k].own,as[s.k].own,s.o)}">${f(hs[s.k].own)}</div><div class="num ${better(as[s.k].own,hs[s.k].own,s.o)}">${f(as[s.k].own)}</div></div><div class="cr"><div class="sub">↳ przeciwko</div><div class="num ${better(hs[s.k].against,as[s.k].against,s.d)}">${f(hs[s.k].against)}</div><div class="num ${better(as[s.k].against,hs[s.k].against,s.d)}">${f(as[s.k].against)}</div></div>`).join('')}</div><div class="small" style="margin-top:8px">Statystyki są razem: wartość drużyny oraz wartość „przeciwko”.</div></section>`}
function outcome(m,t){const hg=num(m.home_goals),ag=num(m.away_goals);if(hg===null||ag===null)return '—';const d=team(m,'home')===t?hg-ag:ag-hg;return d>0?'W':d<0?'L':'D'}
function recentMatch(m,t){
  const ih=team(m,'home')===t;
  const pair=(h,a)=>{
    const x=ih?num(m[h]):num(m[a]);
    const y=ih?num(m[a]):num(m[h]);
    return `${f(x)} — ${f(y)}`;
  };
  const r=outcome(m,t);
  return `<tr>
    <td>${esc(dateText(m.match_date??m.Date))}</td>
    <td class="opponent">${esc(ih?team(m,'away'):team(m,'home'))}</td>
    <td><span class="result ${r.toLowerCase()}">${r}</span> ${m.home_goals??'—'}:${m.away_goals??'—'}</td>
    <td>${pair('home_goals','away_goals')}</td>
    <td>${pair('home_shots','away_shots')}</td>
    <td>${pair('home_shots_on_target','away_shots_on_target')}</td>
    <td>${pair('home_xg','away_xg')}</td>
    <td>${pair('home_corners','away_corners')}</td>
    <td>${pair('home_fouls','away_fouls')}</td>
    <td>${pair('home_yellow_cards','away_yellow_cards')}</td>
    <td>${pair('home_red_cards','away_red_cards')}</td>
    <td>${pair('home_possession','away_possession')}</td>
  </tr>`;
}

function recentTeam(t,v,limit){
  const rows=teamRows(t,v);
  const r=limit==='all'?rows:rows.slice(0,+limit);
  return `<div class="team-section">
    <div class="section-title">
      <h2>📋 ${esc(t)}</h2>
      <span class="badge">${v==='home'?'HOME':v==='away'?'AWAY':'HOME + AWAY'} • ${r.length}</span>
    </div>
    ${
      r.length
      ? `<div class="recent-table-wrap">
          <table class="recent-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Przeciwnik</th>
                <th>Wynik</th>
                <th>Gole</th>
                <th>Strzały</th>
                <th>Celne</th>
                <th>xG</th>
                <th>Rożne</th>
                <th>Faule</th>
                <th>ŻK</th>
                <th>CK</th>
                <th>Posiadanie</th>
              </tr>
            </thead>
            <tbody>
              ${r.map(m=>recentMatch(m,t)).join('')}
            </tbody>
          </table>
        </div>
        <div class="table-note">Wartości statystyk: <strong>${esc(t)} — przeciwnik</strong>.</div>`
      : '<div class="empty">Brak dostępnych meczów.</div>'
    }
  </div>`;
}

function recentCard(h,a,hv,av,limit){
  return `<section class="card">
    <div class="section-title">
      <h2>📋 Ostatnie mecze</h2>
      <span class="badge">${limit==='all'?'Wszystkie':limit} meczów</span>
    </div>
    <div class="small" style="margin-top:4px">
      Jeden wiersz = jeden mecz. Kolumny zawierają kolejne statystyki.
    </div>
    ${recentTeam(h,hv,limit)}
    ${recentTeam(a,av,limit)}
  </section>`;
}
function formCard(h,a,hv,av,limit){const n=limit==='all'?5:Math.min(5,+limit),line=(t,v)=>{const r=teamRows(t,v).slice(0,n);return `<div class="formline"><div class="formteam">${esc(t)}</div>${r.map(m=>{const x=outcome(m,t);return `<span class="dot ${x.toLowerCase()}">${x}</span>`}).join('')}</div>`};return `<section class="card"><h2>📈 Forma</h2>${line(h,hv)}${line(a,av)}<div class="small" style="margin-top:7px">Ostatnie ${n} spotkań.</div></section>`}
function h2hCard(h,a){const r=DATA.filter(m=>{const x=team(m,'home'),y=team(m,'away');return(x===h&&y===a)||(x===a&&y===h)}).sort((x,y)=>dateVal(y.match_date??y.Date)-dateVal(x.match_date??x.Date)).slice(0,10);return `<section class="card"><div class="section-title"><h2>🤝 H2H</h2><span class="badge">${r.length} / 10</span></div>${r.length?r.map(m=>`<div class="match"><div class="match-head"><span>${esc(dateText(m.match_date??m.Date))}</span><span>${esc(m.referee??m.Referee??'')}</span></div><div class="match-name">${esc(team(m,'home'))} — ${esc(team(m,'away'))} <span class="score">${m.home_goals??'—'}:${m.away_goals??'—'}</span></div><div class="small">${esc(lname(lcode(m)))}</div><div class="small" style="margin-top:4px">Strzały ${f(m.home_shots)} — ${f(m.away_shots)} · Celne ${f(m.home_shots_on_target)} — ${f(m.away_shots_on_target)} · Rożne ${f(m.home_corners)} — ${f(m.away_corners)}</div></div>`).join(''):'<div class="empty">Brak H2H.</div>'}</section>`}
function refCard(r){if(!r)return '';const a=DATA.filter(m=>(m.referee??m.Referee)===r),tot=(x,y)=>avg(a.map(m=>{const p=num(m[x]),q=num(m[y]);return p!==null&&q!==null?p+q:null}));return `<section class="card"><div class="section-title"><h2>👨‍⚖️ Sędzia: ${esc(r)}</h2><span class="badge">${a.length} meczów</span></div><div style="margin-top:7px">${[['Faule gospodarzy',avg(a.map(m=>m.home_fouls))],['Faule gości',avg(a.map(m=>m.away_fouls))],['Faule łącznie',tot('home_fouls','away_fouls')],['Żółte gospodarzy',avg(a.map(m=>m.home_yellow_cards))],['Żółte gości',avg(a.map(m=>m.away_yellow_cards))],['Żółte łącznie',tot('home_yellow_cards','away_yellow_cards')],['Czerwone łącznie',tot('home_red_cards','away_red_cards')]].map(x=>`<div class="ref-row"><div>${x[0]}</div><div>${f(x[1])}</div></div>`).join('')}</div></section>`}
function analyze(){if(!homeTeam||!awayTeam){$('results').innerHTML='<section class="card error">Wybierz obie drużyny.</section>';return}if(homeTeam===awayTeam){$('results').innerHTML='<section class="card error">Wybierz dwie różne drużyny.</section>';return}const lim=$('sample').value,mode=$('venueMode').value,hv=mode==='split'?'home':'all',av=mode==='split'?'away':'all';$('results').innerHTML=`<section class="card"><div class="section-title"><h2>${esc(homeTeam)} — ${esc(awayTeam)}</h2><span class="badge">${league?esc(lname(league.code)):'Wszystkie ligi'}</span></div><div class="muted" style="margin-top:7px">${hv==='home'?'HOME':'Wszystkie mecze'} dla ${esc(homeTeam)} · ${av==='away'?'AWAY':'Wszystkie mecze'} dla ${esc(awayTeam)} · próba: ${lim==='all'?'wszystkie':lim}</div></section>${comparison(homeTeam,awayTeam,hv,av,lim)}${formCard(homeTeam,awayTeam,hv,av,lim)}${recentCard(homeTeam,awayTeam,hv,av,lim)}${h2hCard(homeTeam,awayTeam)}${refCard(referee)}`}
function auto(el,items,pick,kind){el.innerHTML='';if(!items.length){el.innerHTML='<div class="autocomplete-empty">Brak wyników.</div>';el.hidden=false;return}items.slice(0,60).forEach(item=>{const d=document.createElement('div');d.className='autocomplete-item';if(kind==='league')d.innerHTML=`<strong>${esc(item.country)} — ${esc(item.name)}</strong><span>${esc(item.code)}</span>`;else if(kind==='ref'){const s=String(item).trim().split(/\s+/).pop();d.innerHTML=`<strong>${esc(item)}</strong><span>Nazwisko: ${esc(s)}</span>`}else{const cs=[...new Set(DATA.filter(m=>team(m,'home')===item||team(m,'away')===item).map(lcode).filter(Boolean))].slice(0,3);d.innerHTML=`<strong>${esc(item)}</strong>${cs.length?`<span>${esc(cs.map(lname).join(' • '))}</span>`:''}`}d.onmousedown=e=>{e.preventDefault();pick(item)};el.appendChild(d)});el.hidden=false}
function closeAuto(){document.querySelectorAll('.autocomplete').forEach(x=>x.hidden=true)}
function setup(){const hs=$('homeSearch'),as=$('awaySearch'),ls=$('leagueSearch'),rs=$('refSearch');hs.onfocus=()=>auto($('homeAuto'),TEAMS.filter(t=>!norm(hs.value)||norm(t).includes(norm(hs.value))),pickHome,'team');hs.oninput=hs.onfocus;as.onfocus=()=>auto($('awayAuto'),TEAMS.filter(t=>!norm(as.value)||norm(t).includes(norm(as.value))),pickAway,'team');as.oninput=as.onfocus;ls.onfocus=()=>auto($('leagueAuto'),LEAGUES.filter(l=>!norm(ls.value)||norm(`${l.country} ${l.name} ${l.code}`).includes(norm(ls.value))),pickLeague,'league');ls.oninput=()=>{league=null;$('leagueSelected').textContent='';auto($('leagueAuto'),LEAGUES.filter(l=>!norm(ls.value)||norm(`${l.country} ${l.name} ${l.code}`).includes(norm(ls.value))),pickLeague,'league')};rs.onfocus=()=>auto($('refAuto'),REFEREES.filter(r=>!norm(rs.value)||norm(r).includes(norm(rs.value))),pickRef,'ref');rs.oninput=rs.onfocus;document.addEventListener('mousedown',e=>{if(!e.target.closest('.field'))closeAuto()});$('analyze').onclick=analyze;$('sample').onchange=analyze;$('venueMode').onchange=analyze}
function pickHome(t){homeTeam=t;$('homeSearch').value='';$('homeSelected').textContent=`${t}`;$('homeAuto').hidden=true;if(awayTeam===t){awayTeam='';$('awaySelected').textContent=''}}
function pickAway(t){awayTeam=t;$('awaySearch').value='';$('awaySelected').textContent=`${t}`;$('awayAuto').hidden=true;if(homeTeam===t){homeTeam='';$('homeSelected').textContent=''}}
function pickLeague(l){league=l;$('leagueSearch').value='';$('leagueSelected').textContent=`${l.country} — ${l.name}`;$('leagueAuto').hidden=true}
function pickRef(r){referee=r;$('refSearch').value='';$('refSelected').textContent=`${r}`;$('refAuto').hidden=true}
async function load(){let all=[],off=0,lim=2000;while(true){const r=await fetch(`/api/matches?limit=${lim}&offset=${off}`,{cache:'no-store'});if(!r.ok)throw Error(`API meczów: HTTP ${r.status}`);const p=await r.json();if(!p.ok)throw Error(p.error||'Błąd API');const rows=p.matches||[];all.push(...rows);if(rows.length<lim||(p.total!=null&&all.length>=Number(p.total)))break;off+=rows.length}DATA=all;const lr=await fetch('/api/leagues',{cache:'no-store'});if(!lr.ok)throw Error(`API lig: HTTP ${lr.status}`);const lp=await lr.json();LEAGUES=(lp.available||lp.imported||[]).map(x=>({code:x.code,name:x.name,country:x.country||''})).filter(x=>x.code&&x.name).sort((a,b)=>a.country.localeCompare(b.country,'pl')||a.name.localeCompare(b.name,'pl'));TEAMS=[...new Set(DATA.flatMap(m=>[team(m,'home'),team(m,'away')]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));REFEREES=[...new Set(DATA.map(m=>m.referee??m.Referee).filter(Boolean))].sort((a,b)=>{const x=norm(a).split(/\s+/).pop(),y=norm(b).split(/\s+/).pop();return x.localeCompare(y,'pl')||norm(a).localeCompare(norm(b,'pl'))})}
(async()=>{try{await load();setup();homeTeam=TEAMS.includes('Arsenal')?'Arsenal':TEAMS[0]||'';awayTeam=TEAMS.includes('Liverpool')?'Liverpool':TEAMS.find(x=>x!==homeTeam)||TEAMS[1]||'';$('homeSelected').textContent=homeTeam?`${homeTeam}`:'';$('awaySelected').textContent=awayTeam?`${awayTeam}`:'';$('status').textContent=`Aktualne dane: ${DATA.length} meczów • ${TEAMS.length} drużyn • ${REFEREES.length} sędziów • ${LEAGUES.length} lig.`;analyze()}catch(e){console.error(e);$('status').textContent='';$('results').innerHTML=`<section class="card error"><h2>Nie udało się załadować danych</h2><div style="margin-top:7px">${esc(e.message||e)}</div></section>`}})();
</script></body></html>
