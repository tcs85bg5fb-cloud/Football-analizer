<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Football Stats Analyzer</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f2f2f7;
  color:#171717;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:1050px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 1px 5px #0001;
}

h1{
  margin:0 0 4px;
  font-size:28px;
}

h2{
  margin:0 0 10px;
  font-size:20px;
}

h3{
  margin:0 0 8px;
  font-size:17px;
}

.muted{
  color:#6e6e73;
  font-size:13px;
}

.small{
  font-size:12px;
  color:#6e6e73;
}

.note{
  background:#f2f2f7;
  border-radius:12px;
  padding:11px;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

label{
  display:block;
  font-weight:600;
  font-size:13px;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #c7c7cc;
  border-radius:11px;
  background:#fff;
  font-size:17px;
  color:#171717;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:700;
}

button:active{
  transform:scale(.99);
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:8px 0;
}

.tab{
  white-space:nowrap;
  border:1px solid #d1d1d6;
  background:#fff;
  color:#171717;
  padding:9px 12px;
  border-radius:10px;
  font-weight:600;
}

.tab.active{
  background:#111;
  color:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,
td{
  padding:9px 8px;
  border-bottom:1px solid #eee;
  text-align:right;
  vertical-align:middle;
}

th:first-child,
td:first-child{
  text-align:left;
}

.scroll{
  overflow-x:auto;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:8px;
  background:#eee;
  font-size:12px;
  font-weight:600;
}

.metric{
  font-size:22px;
  font-weight:700;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.empty{
  padding:12px 0;
  color:#6e6e73;
}

.autocomplete{
  position:relative;
}

.suggestions{
  position:absolute;
  z-index:100;
  left:0;
  right:0;
  top:100%;
  background:#fff;
  border:1px solid #d1d1d6;
  border-radius:12px;
  margin-top:4px;
  max-height:280px;
  overflow-y:auto;
  box-shadow:0 8px 25px #0002;
}

.suggestion{
  padding:11px 13px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.suggestion:last-child{
  border-bottom:0;
}

.suggestion:active{
  background:#f2f2f7;
}

.suggestion-main{
  font-weight:700;
  font-size:15px;
}

.suggestion-meta{
  margin-top:3px;
  color:#6e6e73;
  font-size:12px;
}

.team-line{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}

.good{
  font-weight:800;
}

.result-W{
  background:#e9f8ee;
  color:#137333;
}

.result-D{
  background:#eef2f7;
  color:#5f6b7a;
}

.result-L{
  background:#fdecec;
  color:#c5221f;
}

.result-badge{
  display:inline-block;
  min-width:28px;
  text-align:center;
  padding:4px 7px;
  border-radius:8px;
  font-weight:800;
  font-size:12px;
}

.stat-own{
  font-weight:800;
}

.stat-against{
  font-weight:800;
}

@media(max-width:700px){
  main{
    padding:10px;
  }

  .grid,
  .two{
    grid-template-columns:1fr;
  }

  .grid3{
    grid-template-columns:1fr 1fr;
  }

  table{
    font-size:13px;
  }

  h1{
    font-size:25px;
  }
}
</style>
</head>

<body>
<main>

<section class="card">

  <h1>⚽ Football Stats Analyzer</h1>

  <div class="muted">
    Analiza drużyn na podstawie dostępnych danych meczowych.
  </div>

  <div class="note small">
    Możesz analizować drużyny z różnych lig.
    Statystyki drużyny są liczone osobno od statystyk przeciwników.
  </div>

</section>


<section class="card">

  <div class="grid">

    <div>
      <label>Gospodarz</label>

      <div class="autocomplete">
        <input
          id="homeTeam"
          type="text"
          autocomplete="off"
          placeholder="Wpisz drużynę..."
        >

        <div
          id="homeSuggestions"
          class="suggestions"
          hidden
        ></div>
      </div>
    </div>


    <div>
      <label>Gość</label>

      <div class="autocomplete">
        <input
          id="awayTeam"
          type="text"
          autocomplete="off"
          placeholder="Wpisz drużynę..."
        >

        <div
          id="awaySuggestions"
          class="suggestions"
          hidden
        ></div>
      </div>
    </div>

  </div>


  <div class="grid" style="margin-top:12px">

    <div>
      <label>Liga</label>

      <div class="autocomplete">
        <input
          id="leagueInput"
          type="text"
          autocomplete="off"
          placeholder="Wszystkie ligi"
        >

        <div
          id="leagueSuggestions"
          class="suggestions"
          hidden
        ></div>
      </div>

      <div class="small" style="margin-top:5px">
        Zostaw puste, aby analizować wszystkie ligi.
      </div>
    </div>


    <div>
      <label>Liczba meczów</label>

      <select id="sample">
        <option value="5" selected>5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="all">Wszystkie</option>
      </select>
    </div>

  </div>


  <div class="grid" style="margin-top:12px">

    <div>
      <label>Miejsce meczów</label>

      <select id="venue">
        <option value="split" selected>
          Gospodarz HOME / Gość AWAY
        </option>

        <option value="all">
          Wszystkie mecze
        </option>

        <option value="home">
          Tylko u siebie
        </option>

        <option value="away">
          Tylko na wyjeździe
        </option>
      </select>
    </div>


    <div>
      <label>Sędzia — opcjonalnie</label>

      <div class="autocomplete">
        <input
          id="refereeInput"
          type="text"
          autocomplete="off"
          placeholder="Dowolny / nie wybieraj"
        >

        <div
          id="refereeSuggestions"
          class="suggestions"
          hidden
        ></div>
      </div>
    </div>

  </div>


  <button id="analyze">
    Analizuj mecz
  </button>


  <div
    id="status"
    class="muted"
    style="margin-top:10px"
  >
    Ładowanie danych…
  </div>

</section>


<div id="results"></div>

</main>


<script>

const API_BASE = '';

let DATA = [];
let LEAGUES = [];
let TEAMS = [];
let REFEREES = [];

let selectedLeague = '';
let selectedReferee = '';

let homeTeamInput =
  document.getElementById('homeTeam');

let awayTeamInput =
  document.getElementById('awayTeam');

let leagueInput =
  document.getElementById('leagueInput');

let refereeInput =
  document.getElementById('refereeInput');

let homeSuggestions =
  document.getElementById('homeSuggestions');

let awaySuggestions =
  document.getElementById('awaySuggestions');

let leagueSuggestions =
  document.getElementById('leagueSuggestions');

let refereeSuggestions =
  document.getElementById('refereeSuggestions');

let sampleSelect =
  document.getElementById('sample');

let venueSelect =
  document.getElementById('venue');

let results =
  document.getElementById('results');

let status =
  document.getElementById('status');


/*
 * =========================================================
 * HELPERS
 * =========================================================
 */

function clean(value){

  if(
    value === undefined ||
    value === null
  ){
    return null;
  }

  const v =
    String(value).trim();

  return v === ''
    ? null
    : v;
}


function num(value){

  if(
    value === undefined ||
    value === null ||
    value === ''
  ){
    return null;
  }

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}


function avg(values){

  const nums =
    values
      .map(num)
      .filter(
        x => x !== null
      );

  if(!nums.length){
    return null;
  }

  return nums.reduce(
    (a,b) => a + b,
    0
  ) / nums.length;
}


function f(value){

  const n =
    num(value);

  if(n === null){
    return '—';
  }

  return n.toFixed(1);
}


function esc(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"]/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[m])
  );
}


function normalize(value){

  return String(
    value ?? ''
  )
    .toLocaleLowerCase('pl-PL')
    .normalize('NFD')
    .replace(
      /[\u0300-\u036f]/g,
      ''
    )
    .trim();
}


function dateValue(value){

  if(!value){
    return 0;
  }

  const s =
    String(value);

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(s)
  ){
    return new Date(
      s + 'T00:00:00'
    ).getTime();
  }

  const p =
    s.split('/');

  if(p.length === 3){

    return new Date(
      Number(p[2]),
      Number(p[1]) - 1,
      Number(p[0])
    ).getTime();

  }

  const d =
    new Date(s);

  return Number.isNaN(
    d.getTime()
  )
    ? 0
    : d.getTime();
}


/*
 * =========================================================
 * LOAD DATA
 * =========================================================
 */

async function loadJSON(
  path,
  params = {}
){

  const qs =
    new URLSearchParams(
      params
    );

  const url =
    API_BASE +
    path +
    (
      qs.toString()
        ? '?' + qs.toString()
        : ''
    );

  const response =
    await fetch(
      url,
      {
        cache:'no-store'
      }
    );

  if(!response.ok){

    throw new Error(
      `Błąd API ${response.status}`
    );

  }

  return await response.json();
}


async function loadLeagues(){

  const payload =
    await loadJSON(
      '/api/leagues'
    );

  if(
    !payload ||
    !Array.isArray(
      payload.available
    )
  ){
    throw new Error(
      'API lig zwróciło nieprawidłowe dane.'
    );
  }

  LEAGUES =
    payload.available
      .map(
        league => ({
          code:
            league.code,

          name:
            league.name,

          country:
            league.country
        })
      );

}


async function loadMatches(){

  DATA = [];

  const limit = 2000;

  let offset = 0;

  while(true){

    const payload =
      await loadJSON(
        '/api/matches',
        {
          limit,
          offset
        }
      );

    const matches =
      Array.isArray(
        payload.matches
      )
        ? payload.matches
        : [];

    DATA.push(
      ...matches
    );

    if(
      matches.length < limit
    ){
      break;
    }

    offset += limit;

    /*
     * Bezpiecznik.
     */
    if(offset > 50000){
      break;
    }
  }


  const teamSet =
    new Set();

  const refereeSet =
    new Set();

  for(
    const match
    of DATA
  ){

    if(match.home_team){
      teamSet.add(
        match.home_team
      );
    }

    if(match.away_team){
      teamSet.add(
        match.away_team
      );
    }

    if(match.referee){
      refereeSet.add(
        match.referee
      );
    }
  }


  TEAMS =
    [...teamSet].sort(
      (a,b) =>
        a.localeCompare(
          b,
          'pl'
        )
    );


  REFEREES =
    [...refereeSet].sort(
      (a,b) =>
        surname(a).localeCompare(
          surname(b),
          'pl'
        ) ||
        a.localeCompare(
          b,
          'pl'
        )
    );

}


/*
 * =========================================================
 * SURNAME / REFEREE
 * =========================================================
 */

function surname(name){

  const parts =
    String(name || '')
      .trim()
      .split(/\s+/);

  return parts.length
    ? parts[parts.length - 1]
    : '';
}


/*
 * =========================================================
 * AUTOCOMPLETE
 * =========================================================
 */

function closeAllSuggestions(){

  homeSuggestions.hidden = true;
  awaySuggestions.hidden = true;
  leagueSuggestions.hidden = true;
  refereeSuggestions.hidden = true;

}


function renderSuggestions(
  container,
  items,
  onSelect
){

  container.innerHTML = '';

  if(!items.length){

    container.hidden = true;
    return;
  }


  items.forEach(
    item => {

      const div =
        document.createElement(
          'div'
        );

      div.className =
        'suggestion';

      div.innerHTML =
        item.html;

      div.onclick = () => {

        onSelect(
          item
        );

        container.hidden =
          true;

      };

      container.appendChild(
        div
      );

    }
  );


  container.hidden = false;

}


/*
 * =========================================================
 * LEAGUE AUTOCOMPLETE
 * =========================================================
 */

function leagueSearch(){

  const q =
    normalize(
      leagueInput.value
    );


  const items =
    LEAGUES
      .filter(
        league => {

          if(!q){
            return true;
          }

          return normalize(
            league.name
          ).includes(q) ||
          normalize(
            league.country
          ).includes(q) ||
          normalize(
            league.code
          ).includes(q);

        }
      )
      .sort(
        (a,b) => {

          const aa =
            normalize(
              a.country +
              ' ' +
              a.name
            );

          const bb =
            normalize(
              b.country +
              ' ' +
              b.name
            );

          return aa.localeCompare(
            bb,
            'pl'
          );

        }
      )
      .slice(
        0,
        20
      )
      .map(
        league => ({
          league,

          html:
            `<div class="suggestion-main">
              ${esc(league.country)} — ${esc(league.name)}
            </div>
            <div class="suggestion-meta">
              ${esc(league.code)}
            </div>`
        })
      );


  /*
   * Zawsze pokazujemy opcję All.
   */
  items.unshift({
    league:null,

    html:
      `<div class="suggestion-main">
        Wszystkie ligi
      </div>
      <div class="suggestion-meta">
        Bez ograniczenia ligi
      </div>`
  });


  renderSuggestions(
    leagueSuggestions,
    items,
    item => {

      if(item.league){

        selectedLeague =
          item.league.code;

        leagueInput.value =
          `${item.league.country} — ${item.league.name}`;

      }else{

        selectedLeague = '';

        leagueInput.value = '';

      }

    }
  );

}


/*
 * =========================================================
 * TEAM AUTOCOMPLETE
 * =========================================================
 */

function teamLeagueMeta(
  teamName
){

  const leagues =
    new Map();

  for(
    const match
    of DATA
  ){

    if(
      match.home_team === teamName ||
      match.away_team === teamName
    ){

      const key =
        match.league_code ||
        match.league ||
        '';

      if(key){

        const league =
          LEAGUES.find(
            l =>
              l.code ===
              match.league_code
          );

        if(league){

          leagues.set(
            league.code,
            `${league.country} — ${league.name}`
          );

        }else{

          leagues.set(
            key,
            match.league
          );

        }

      }

    }

  }


  return [
    ...leagues.values()
  ].sort(
    (a,b) =>
      a.localeCompare(
        b,
        'pl'
      )
  );

}


function teamSearch(
  input,
  container
){

  const q =
    normalize(
      input.value
    );


  let items =
    TEAMS
      .filter(
        team => {

          if(!q){
            return true;
          }

          return normalize(
            team
          ).includes(q);

        }
      )
      .map(
        team => {

          const meta =
            teamLeagueMeta(
              team
            );

          return {
            team,

            html:
              `<div class="suggestion-main">
                ${esc(team)}
              </div>
              <div class="suggestion-meta">
                ${
                  meta.length
                    ? esc(
                        meta
                          .slice(0,3)
                          .join(' • ')
                      )
                    : 'Brak informacji o lidze'
                }
              </div>`
          };

        }
      )
      .slice(
        0,
        20
      );


  renderSuggestions(
    container,
    items,
    item => {

      input.value =
        item.team;

    }
  );

}


/*
 * =========================================================
 * REFEREE AUTOCOMPLETE
 * =========================================================
 */

function refereeSearch(){

  const q =
    normalize(
      refereeInput.value
    );


  const items =
    REFEREES
      .filter(
        name => {

          if(!q){
            return true;
          }

          return normalize(
            name
          ).includes(q) ||
          normalize(
            surname(name)
          ).includes(q);

        }
      )
      .sort(
        (a,b) =>
          surname(a).localeCompare(
            surname(b),
            'pl'
          ) ||
          a.localeCompare(
            b,
            'pl'
          )
      )
      .slice(
        0,
        20
      )
      .map(
        name => ({
          name,

          html:
            `<div class="suggestion-main">
              ${esc(name)}
            </div>
            <div class="suggestion-meta">
              Nazwisko: ${esc(surname(name))}
            </div>`
        })
      );


  items.unshift({
    name:'',

    html:
      `<div class="suggestion-main">
        Dowolny / nie wybieraj
      </div>`
  });


  renderSuggestions(
    refereeSuggestions,
    items,
    item => {

      selectedReferee =
        item.name || '';

      refereeInput.value =
        item.name || '';

    }
  );

}


/*
 * =========================================================
 * TEAM MATCHES
 * =========================================================
 */

function teamMatches(
  team,
  venue,
  leagueCode
){

  let rows =
    DATA.filter(
      match => {

        const isHome =
          match.home_team === team;

        const isAway =
          match.away_team === team;


        if(!isHome && !isAway){
          return false;
        }


        if(
          leagueCode &&
          match.league_code !==
            leagueCode
        ){
          return false;
        }


        if(
          venue === 'home' &&
          !isHome
        ){
          return false;
        }


        if(
          venue === 'away' &&
          !isAway
        ){
          return false;
        }


        return true;

      }
    );


  return rows.sort(
    (a,b) =>
      dateValue(
        b.match_date
      ) -
      dateValue(
        a.match_date
      )
  );

}


/*
 * =========================================================
 * SAMPLE
 * =========================================================
 */

function applySample(
  rows
){

  const value =
    sampleSelect.value;


  if(value === 'all'){
    return rows;
  }


  const n =
    Number(value);


  if(
    !Number.isFinite(n)
  ){
    return rows;
  }


  return rows.slice(
    0,
    n
  );

}


/*
 * =========================================================
 * OPPONENT
 * =========================================================
 */

function isHomeMatch(
  match,
  team
){

  return match.home_team === team;

}


function ownValue(
  match,
  team,
  homeField,
  awayField
){

  return isHomeMatch(
    match,
    team
  )
    ? num(match[homeField])
    : num(match[awayField]);

}


function opponentValue(
  match,
  team,
  homeField,
  awayField
){

  return isHomeMatch(
    match,
    team
  )
    ? num(match[awayField])
    : num(match[homeField]);

}


/*
 * =========================================================
 * STATISTICS
 * =========================================================
 */

const STAT_DEFINITIONS = [

  {
    key:'goals',
    label:'Gole',
    ownHome:'home_goals',
    ownAway:'away_goals',
    againstHome:'away_goals',
    againstAway:'home_goals',
    higherBetter:true
  },

  {
    key:'shots',
    label:'Strzały',
    ownHome:'home_shots',
    ownAway:'away_shots',
    againstHome:'away_shots',
    againstAway:'home_shots',
    higherBetter:true
  },

  {
    key:'shotsOnTarget',
    label:'Strzały celne',
    ownHome:'home_shots_on_target',
    ownAway:'away_shots_on_target',
    againstHome:'away_shots_on_target',
    againstAway:'home_shots_on_target',
    higherBetter:true
  },

  {
    key:'xg',
    label:'xG',
    ownHome:'home_xg',
    ownAway:'away_xg',
    againstHome:'away_xg',
    againstAway:'home_xg',
    higherBetter:true
  },

  {
    key:'corners',
    label:'Rożne',
    ownHome:'home_corners',
    ownAway:'away_corners',
    againstHome:'away_corners',
    againstAway:'home_corners',
    higherBetter:true
  },

  {
    key:'fouls',
    label:'Faule',
    ownHome:'home_fouls',
    ownAway:'away_fouls',
    againstHome:'away_fouls',
    againstAway:'home_fouls',
    higherBetter:false
  },

  {
    key:'yellow',
    label:'Żółte kartki',
    ownHome:'home_yellow_cards',
    ownAway:'away_yellow_cards',
    againstHome:'away_yellow_cards',
    againstAway:'home_yellow_cards',
    higherBetter:false
  },

  {
    key:'red',
    label:'Czerwone kartki',
    ownHome:'home_red_cards',
    ownAway:'away_red_cards',
    againstHome:'away_red_cards',
    againstAway:'home_red_cards',
    higherBetter:false
  },

  {
    key:'possession',
    label:'Posiadanie piłki %',
    ownHome:'home_possession',
    ownAway:'away_possession',
    againstHome:'away_possession',
    againstAway:'home_possession',
    higherBetter:true
  }

];


function teamStats(
  team,
  rows
){

  const result = {
    matches:
      rows.length
  };


  for(
    const stat
    of STAT_DEFINITIONS
  ){

    const own =
      rows.map(
        match =>
          ownValue(
            match,
            team,
            stat.ownHome,
            stat.ownAway
          )
      );


    const against =
      rows.map(
        match =>
          opponentValue(
            match,
            team,
            stat.againstHome,
            stat.againstAway
          )
      );


    result[stat.key] = {
      own:
        avg(own),

      against:
        avg(against)
    };

  }


  return result;

}


/*
 * =========================================================
 * BETTER STAT
 * =========================================================
 */

function betterClass(
  a,
  b,
  higherBetter
){

  if(
    a === null ||
    b === null
  ){
    return ['', ''];
  }


  if(
    Math.abs(a - b) < 0.000001
  ){
    return ['', ''];
  }


  if(higherBetter){

    return a > b
      ? ['good','']
      : ['','good'];

  }


  return a < b
    ? ['good','']
    : ['','good'];

}

 * SUMMARY CARD

/*
 * =========================================================
 * RESULT
 * =========================================================
 */

function outcomeFor(
  match,
  team
){

  const home =
    match.home_team === team;


  const hg =
    num(
      match.home_goals
    );

  const ag =
    num(
      match.away_goals
    );


  if(
    hg === null ||
    ag === null
  ){
    return '—';
  }


  const diff =
    home
      ? hg - ag
      : ag - hg;


  if(diff > 0){
    return 'W';
  }

  if(diff < 0){
    return 'L';
  }

  return 'D';

}

  away
){

  return DATA

        (
          match.home_team === home &&
          match.away_team === away
        ) ||
        (
          match.home_team === away &&
          match.away_team === home

    .sort(

        dateValue(
          b.match_date

        dateValue(
          a.match_date

/*

 * =========================================================
 */

function refereeProfile(
  name
){

  if(!name){
    return '';
  }


  /*
   * Profil sędziego jest niezależny
   * od próbki drużyny.
   */
  const rows =
    DATA.filter(
      match =>
        match.referee === name
    );


  if(!rows.length){

    return `
      <section class="card">

        <h2>
          👨‍⚖️ Sędzia: ${esc(name)}
        </h2>

        <div class="empty">
          Brak meczów przypisanych do tego sędziego
          w załadowanych danych.
        </div>

      </section>
    `;

  }


  const average =
    key =>
      avg(
        rows.map(
          match =>
            num(match[key])
        )
      );


  const totalAverage =
    (a,b) =>
      avg(
        rows.map(
          match => {

            const x =
              num(match[a]);

            const y =
              num(match[b]);

            if(
              x === null ||
              y === null
            ){
              return null;
            }

            return x + y;

          }
        )
      );


  return `
    <section class="card">

      <div class="section-title">

        <h2>
          👨‍⚖️ Sędzia: ${esc(name)}
        </h2>

        <span class="badge">
          ${rows.length} meczów w danych
        </span>

      </div>


      <div class="scroll">

        <table>

          <tr>
            <th>Statystyka</th>
            <th>Średnia na mecz</th>
          </tr>

          <tr>
            <td>Faule gospodarzy</td>
            <td>${f(
              average(
                'home_fouls'
              )
            )}</td>
          </tr>

          <tr>
            <td>Faule gości</td>
            <td>${f(
              average(
                'away_fouls'
              )
            )}</td>
          </tr>

          <tr>
            <td>Faule łącznie</td>
            <td>${f(
              totalAverage(
                'home_fouls',
                'away_fouls'
              )
            )}</td>
          </tr>

          <tr>
            <td>Żółte gospodarzy</td>
            <td>${f(
              average(
                'home_yellow_cards'
              )
            )}</td>
          </tr>

          <tr>
            <td>Żółte gości</td>
            <td>${f(
              average(
                'away_yellow_cards'
              )
            )}</td>
          </tr>

          <tr>
            <td>Żółte łącznie</td>
            <td>${f(
              totalAverage(
                'home_yellow_cards',
                'away_yellow_cards'
              )
            )}</td>
          </tr>

          <tr>
            <td>Czerwone łącznie</td>
            <td>${f(
              totalAverage(
                'home_red_cards',
                'away_red_cards'
              )
            )}</td>
          </tr>

        </table>

      </div>


      <div class="small" style="margin-top:8px">
        Profil liczony z wszystkich meczów przypisanych
        do wybranego sędziego w załadowanych danych.
      </div>

    </section>
  `;

}

function analyze(){

  const home =
    homeTeamInput.value.trim();

  const away =
    awayTeamInput.value.trim();


  if(!home || !away){

    results.innerHTML = `
      <section class="card">

        <h2>
          Wybierz obie drużyny.
        </h2>

        <div class="muted">
          Wpisz gospodarza i gościa,
          a następnie uruchom analizę.
        </div>

      </section>
    `;

    return;
  }


  if(home === away){

    results.innerHTML = `
      <section class="card">
        Wybierz dwie różne drużyny.
      </section>
    `;

    return;
  }


  /*
   * =======================================================
   * VENUE
   * =======================================================
   */

  const venueMode =
    venueSelect.value;


  let homeVenue =
    'home';

  let awayVenue =
    'away';

  let homeVenueLabel =
    'U siebie';

  let awayVenueLabel =
    'Na wyjeździe';


  if(
    venueMode === 'all'
  ){

    homeVenue =
      'all';

    awayVenue =
      'all';

    homeVenueLabel =
      'Wszystkie mecze';

    awayVenueLabel =
      'Wszystkie mecze';

  }else if(
    venueMode === 'home'
  ){

    homeVenue =
      'home';

    awayVenue =
      'home';

    homeVenueLabel =
      'U siebie';

    awayVenueLabel =
      'U siebie';

  }else if(
    venueMode === 'away'
  ){

    homeVenue =
      'away';

    awayVenue =
      'away';

    homeVenueLabel =
      'Na wyjeździe';

    awayVenueLabel =
      'Na wyjeździe';

  }


  /*
   * Dla "all" helper musi zaakceptować oba miejsca.
   */
  function getRows(
    team,
    venue
  ){

    if(venue === 'all'){

      return teamMatches(
        team,
        'all',
        selectedLeague
      );

    }


    return teamMatches(
      team,
      venue,
      selectedLeague
    );

  }


  const homeAll =
    getRows(
      home,
      homeVenue
    );


  const awayAll =
    getRows(
      away,
      awayVenue
    );


  /*
   * Próbka jest liczona niezależnie
   * dla każdej drużyny.
   */
  const homeRows =
    applySample(
      homeAll
    );


  const awayRows =
    applySample(
      awayAll
    );


  /*
   * Sędzia NIE zmienia próby.
   */
  const referee =
    selectedReferee;


  /*
   * Nazwa ligi w nagłówku.
   */
  const selectedLeagueConfig =
    LEAGUES.find(
      league =>
        league.code ===
        selectedLeague
    );


  const leagueTitle =
    selectedLeagueConfig
      ? `${selectedLeagueConfig.country} — ${selectedLeagueConfig.name}`
      : 'Wszystkie ligi';


  results.innerHTML = `

    <section class="card">

      <h2>
        ${esc(home)}
        —
        ${esc(away)}
      </h2>

      <span class="badge">
        ${esc(leagueTitle)}
      </span>

      <div
        class="muted"
        style="margin-top:8px"
      >
        Statystyki drużyn są liczone
        niezależnie.
        Próbka: ${
          sampleSelect.value === 'all'
            ? 'wszystkie'
            : sampleSelect.value
        }.

    </section>


    <div class="grid">

      ${summaryCard(
        home,
        homeRows,
        homeVenueLabel
      )}

      ${summaryCard(
        away,
        awayRows,
        awayVenueLabel
      )}

    </div>


    ${renderDetails(
      home,
      homeRows,
      homeVenueLabel
    )}


    ${renderDetails(
      away,
      awayRows,
      awayVenueLabel
    )}


    ${h2hCard(
      home,
      away
    )}


    ${sampleInfo(
      home,
      homeRows,
      selectedLeague
    )}


    ${sampleInfo(
      away,
      awayRows,
      selectedLeague
    )}


    ${refereeProfile(
      referee
    )}

  `;

}

sampleSelect.addEventListener(
  'change',
  analyze
);


venueSelect.addEventListener(
  'change',
  analyze
);


/*
 * =========================================================
 * BOOT
 * =========================================================
 */

async function boot(){

  try{

    status.textContent =
      'Pobieranie lig…';


    await loadLeagues();


    status.textContent =
      'Pobieranie meczów…';


    await loadMatches();


    /*
     * Domyślne drużyny.
     */
    homeTeamInput.value =
      TEAMS.includes(
        'Arsenal'
      )
        ? 'Arsenal'
        : (
            TEAMS[0] || ''
          );


    awayTeamInput.value =
      TEAMS.includes(
        'Liverpool'
      )
        ? 'Liverpool'
        : (
            TEAMS.find(
              team =>
                team !==
                homeTeamInput.value
            ) ||
            TEAMS[1] ||
            ''
          );


    status.textContent =
      `Aktualne dane: ${DATA.length} meczów, ` +
      `${TEAMS.length} drużyn i ` +
      `${REFEREES.length} sędziów. ` +
      `${LEAGUES.length} lig.`;


    analyze();

  }catch(error){

    console.error(
      error
    );


    status.textContent =
      'Nie udało się załadować danych.';


    results.innerHTML = `
      <section class="card">

        <h2>
          Nie udało się załadować danych
        </h2>

        <div class="muted">
          ${esc(
            error.message ||
            'Nieznany błąd.'
          )}
        </div>

      </section>
    `;

  }

}


boot();

</script>

</body>
</html>
