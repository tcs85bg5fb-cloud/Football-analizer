x+='</section>';document.getElementById("results").innerHTML=`<section class="card"><h2>${h} – ${a}</h2><span class="badge">MVP: średnie + H2H</span><div class="muted" style="margin-top:8px">Oba sezony są połączone. Gospodarz: mecze u siebie; gość: mecze wyjazdowe.</div></section><div class="grid">${card(h,"home")}${card(a,"away")}</div>${x}`}
